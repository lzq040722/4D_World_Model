# Environment motion scene configuration template.
# This file is merged with examples/base-config.yaml at runtime.
# Replace the angle-bracket placeholders before running.

# ========== Scene I/O ==========
# Scene identifier. Use a short directory-safe name, for example: flowing_river.
scene_name: "Golden_Gate_Bridge"

# Must match the asset directory: examples/imgs/<example_name>/image.png.
# Keeping this identical to scene_name is recommended.
example_name: "Golden_Gate_Bridge"
input_image: "Golden_Gate_Bridge.png"
data_path: "examples/imgs"
examples_dir: "examples/imgs/Golden_Gate_Bridge"
sky_image_dir: "examples/imgs/Golden_Gate_Bridge"

# Output and working directories for this scene.
runs_dir: "3d_result/wonderplay/Golden_Gate_Bridge"
work_dir: "3d_result/wonderplay/Golden_Gate_Bridge"

# ========== Runtime ==========
seed: 1
frames: 5
device: cuda
debug: True

# ========== Keyframe Generation ==========
num_scenes: 16
use_gpt: False
kf2_upsample_coef: 4
skip_interp: True
skip_gen: False
enable_regenerate: False

# ========== Decoder / Depth ==========
finetune_decoder_gen: False
finetune_decoder_interp: False
finetune_depth_model: True

# Venice uses Marigold with these depth/camera scales; they are good defaults for
# outdoor water scenes and can be tuned per image.
depth_model: marigold
depth_model_indoor: False

# ========== Inpainting ==========
inpainting_resolution_gen: 512
inpainting_resolution_interp: 512
negative_inpainting_prompt: "collage, text, writings, signs, text, white border, photograph border, artifacts, blur, blurry, foggy, fog, bad quality, distortions, distorted image, watermark, signature, fisheye look"

# ========== Camera / Scene Geometry ==========
# Must have num_scenes entries. Venice pans right for 8 views and left for 8 views.
rotation_path: [2, 2, 2, 2, 2, 2, 2, 2, -2, -2, -2, -2, -2, -2, -2, -2]
camera_speed_multiplier_rotation: 0.3
rotation_range: 0.37
init_focal_length: 970

camera_speed: 0.001
fg_depth_range: 0.015
depth_shift: 0.001
sky_hard_depth: 0.02

gen_sky: False
gen_layer: True
refine_depth_conditioning: False
sky_example_name: "Golden_Gate_Bridge"

foreground_ids: [76]
ground_ids: []
object_split_mask_sam_ids: [55]

base_inpainting_prompt: 'Remove the boat from the river.'
base_inpainting_negative_prompt: 'tree, plant, ship, boat'
without_heuristic_set_depth_image: True
imgto3D: True
imgto3d_method: "instantmesh"
imgto3d_fg_ratio: 0.85
imgto3d_resolution: 128
imgto3d_optimization_iters: 3500
object_num: 1

text_prompt: a boat on the river

force_function_name: force_venice_1

material_types: [
  "rigid",
]

rigid_friction: 0.05
rigid_coup_friction: 0.05
rigid_coup_softness: 0.1

collision_force_with_env: False
collision_force_with_obj: False
collision_constraint_with_env: True
collision_constraint_with_obj: True

simulation_iterations: 2
simulation_steps: 50
dt: 0.01

boundary_rules: {y_min: -0.4}

# ========== Motion Type Configuration ==========
# Select the LivingWorld HashGrid environment-motion branch.
motion_type: "interaction"
interaction:
  direction: "env2obj"  # "env2obj" or "obj2env"
  # v_obj = velocity_scale * environment_displacement
  velocity_scale: 0.5
  num_frames: 45
  # Environment Gaussian 的渲染运动幅度
  environment_scale_factor: 1.0

# Environment motion configuration.
environment_motion:
  # Motion amplitude. Venice uses 0.5; try 0.5-1.0 first, then increase for
  # faster water, smoke, fire, grass, or clouds.
  scale_factor: 1.0

  # Text used by SAM3 to select the moving region.
  # Examples: "water", "smoke", "grass", "cloud", or "water, river".
  sam_prompt: "water"

  # Required motion arrows in 512x512 image coordinates.
  # Each item is [start_x, start_y, end_x, end_y].
  # Add arrows across representative parts of the moving region.
  fixed_hints:  [
    [223, 315, 396, 326],
    [313, 273, 476, 281],
    [414, 231, 498, 240]
  ]
